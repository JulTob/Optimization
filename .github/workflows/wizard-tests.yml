name: Wizard regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/wizard-tests.yml
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "sympy>=1.13,<2" "matplotlib>=3.9,<4" "ipywidgets>=8,<9"
      - name: Run all Wizard regression tests
        env:
          MPLBACKEND: Agg
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
