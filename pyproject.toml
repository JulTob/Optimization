[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rampas"
version = "0.1.0"
description = "Regresión isotónica por rampas saturadas y modelos Zigurat, Diana y Tangentes."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["Rampas"]
